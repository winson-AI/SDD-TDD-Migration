<text x="800.0" y="1332.0" font-size="26.00" fill="#111827" text-anchor="middle" font-weight="650">真实媒体验证</text>
<text x="800.0" y="1366.0" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">单图 / 双图 / 跨步骤 / 参考图 / 视频</text>
<text x="800.0" y="1395.0" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">时间线取证；视频录制 / 时间映射 / 裁剪 / 压缩</text>
<text x="800.0" y="1424.0" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">输出布尔结果 + 原始理由 + 实际工具 + 媒体引用</text>
