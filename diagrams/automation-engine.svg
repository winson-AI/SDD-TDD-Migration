<text x="800.0" y="1524.0" font-size="25.00" fill="#111827" text-anchor="middle" font-weight="650">ObservationSink · 每次立即落盘</text>
<text x="800.0" y="1558.0" font-size="21.00" fill="#4b5563" text-anchor="middle" font-weight="400">sequence / ASSERT ID / result / reason / tool / error</text>
<text x="800.0" y="1587.0" font-size="21.00" fill="#4b5563" text-anchor="middle" font-weight="400">evidence_refs = 实际媒体路径 + SHA256</text>
