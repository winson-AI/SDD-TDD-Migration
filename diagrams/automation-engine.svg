<rect x="676.8" y="1628" width="246.4" height="29" rx="4" fill="white" opacity="0.97"/>
<text x="800" y="1648" font-size="20.00" fill="#6b7280" text-anchor="middle" font-weight="400">完成 / 异常 / 预算耗尽</text>
<rect x="440" y="1675" width="720" height="170" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
<rect x="445" y="1680" width="710" height="160" rx="10" fill="none" stroke="#2563eb" stroke-opacity="0.28"/>
<text x="800.0" y="1710.0" font-size="26.00" fill="#111827" text-anchor="middle" font-weight="650">report() · 汇总全部观察</text>
<text x="800.0" y="1744.0" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">Yellow 优先：缺断言 / 媒体 / 异常 / 歧义 / flaky</text>
<text x="800.0" y="1773.0" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">无阻断但有有效 false → Red；完整 true → Green</text>
<text x="800.0" y="1802.0" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">保留失败观察；同 ASSERT 混合 pass/fail 不挑最好一次</text>
<text x="800.0" y="1831.0" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">final_output 文本不能生成通过结论</text>
<path d="M800,1845 L800,1900" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M458,1900 H1160 L1142,2045 H440 Z" fill="#f9fafb" stroke="#6b7280" stroke-width="1.7"/>
<text x="800.0" y="1937.0" font-size="25.00" fill="#111827" text-anchor="middle" font-weight="650">result.json → 宿主 receipt → tests stage</text>
<text x="800.0" y="1971.0" font-size="21.00" fill="#4b5563" text-anchor="middle" font-weight="400">quality / assertions / root_cause / flaky / 上下文身份</text>
<text x="800.0" y="2000.0" font-size="21.00" fill="#4b5563" text-anchor="middle" font-weight="400">观察 / 环境 / 全部工件 / 源快照引用</text>
<text x="800.0" y="2029.0" font-size="21.00" fill="#4b5563" text-anchor="middle" font-weight="400">交 Ledger 校验，MO 或 Auditor 按阶段验收</text>
<text x="800" y="2110" font-size="21.00" fill="#4b5563" text-anchor="middle" font-weight="400">时序和 exact 仍含模型判断；宿主需提供真实 App 安装与环境证据，文件摘要不能代替真机验证。</text>
