<rect width="1600" height="2230" fill="white"/>
<text x="60" y="56" font-size="21.00" fill="#6b7280" text-anchor="start" font-weight="400">06  /  SDD-TDD-Migration</text>
<text x="60" y="108" font-size="38.00" fill="#111827" text-anchor="start" font-weight="700">Harmony · 单 PATH 自动化内核</text>
<text x="60" y="145" font-size="21.00" fill="#6b7280" text-anchor="start" font-weight="400">内核属于同一次 Test-Runner 执行；只负责设备操作与断言取证，不承担外层修复或验收权限</text>
