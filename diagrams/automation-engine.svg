<text x="1100" y="760" font-size="20.00" fill="#6b7280" text-anchor="middle" font-weight="400">有效录制</text>
<rect x="80" y="880" width="600" height="140" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
<rect x="85" y="885" width="590" height="130" rx="10" fill="none" stroke="#2563eb" stroke-opacity="0.28"/>
<text x="380.0" y="914.5" font-size="26.00" fill="#111827" text-anchor="middle" font-weight="650">Planner → Executor</text>
<text x="380.0" y="948.5" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">Observe → 单步工具 / execute → 实际反馈</text>
<text x="380.0" y="977.5" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">general / glm / MCP / Hypium MCP</text>
<text x="380.0" y="1006.5" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">压缩上下文 / 可选反思 / 技能 / XPath 缓存</text>
<rect x="920" y="880" width="600" height="140" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
<rect x="925" y="885" width="590" height="130" rx="10" fill="none" stroke="#2563eb" stroke-opacity="0.28"/>
<text x="1220.0" y="914.5" font-size="26.00" fill="#111827" text-anchor="middle" font-weight="650">ToolPlayer · 导航回放</text>
<text x="1220.0" y="948.5" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">坐标 / XPath / 输入 / 进度条 / 临时控件</text>
<text x="1220.0" y="977.5" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">意外弹窗处理；验证不复用旧通过结果</text>
<text x="1220.0" y="1006.5" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">失败时携带历史，在剩余预算内重规划</text>
<rect x="539.6" y="845" width="80.8" height="29" rx="4" fill="white" opacity="0.97"/>
<text x="580" y="865" font-size="20.00" fill="#7c3aed" text-anchor="middle" font-weight="400">入口 C</text>
