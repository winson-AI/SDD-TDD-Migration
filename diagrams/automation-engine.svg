<text x="800.0" y="603.5" font-size="26.00" fill="#111827" text-anchor="middle" font-weight="650">task_text：步骤与冻结断言交错</text>
<text x="800.0" y="637.5" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">每条 verify 使用单个 [ASSERT:id]；知识只辅助执行</text>
