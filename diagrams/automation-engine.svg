<text x="1420" y="865" font-size="20.00" fill="#7c3aed" text-anchor="middle" font-weight="400">入口 D</text>
<path d="M920,950 L680,950" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<rect x="741.0" y="910" width="118" height="29" rx="4" fill="white" opacity="0.97"/>
<text x="800" y="930" font-size="20.00" fill="#7c3aed" text-anchor="middle" font-weight="400">失败重规划</text>
