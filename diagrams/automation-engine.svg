<text x="1385.0" y="1357.0" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">截图 / 布局 / 视频</text>
<text x="1385.0" y="1386.0" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">原生 HTML / MD / JSON</text>
<text x="1385.0" y="1415.0" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">engine.log / 工具时间线</text>
<text x="1385.0" y="1444.0" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">候选录制与执行记忆</text>
<text x="1385.0" y="1473.0" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">不是已验证的修复 memory</text>
