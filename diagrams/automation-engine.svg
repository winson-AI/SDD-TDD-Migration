<text x="225.0" y="1351.5" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">Planner 返回 C</text>
<text x="225.0" y="1380.5" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">ToolPlayer 返回 D</text>
<text x="225.0" y="1409.5" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">仍受步骤 / 超时预算限制</text>
<text x="225.0" y="1438.5" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">禁止重启或放宽验收</text>
<path d="M440,1545 L225,1545 L225,1465" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
