<text x="800.0" y="234.0" font-size="25.00" fill="#111827" text-anchor="middle" font-weight="650">完整 query + 引擎配置</text>
<text x="800.0" y="268.0" font-size="21.00" fill="#4b5563" text-anchor="middle" font-weight="400">冻结步骤 / 参数 / ASSERT / after_step / 当前代码身份</text>
<text x="800.0" y="297.0" font-size="20.21" fill="#4b5563" text-anchor="middle" font-weight="400">设备 / 三类模型 / 预算 / 可选 knowledge_ref 与 recording_ref</text>
<path d="M800,320 L800,375" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
