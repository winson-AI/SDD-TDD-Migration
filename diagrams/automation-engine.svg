<text x="800.0" y="1203.0" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">ASSERT ID 找回冻结谓词与 matcher，防止改写期望</text>
<text x="800.0" y="1232.0" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">固定 verification 强制保留；auto 才动态选择</text>
<path d="M800,1250 L800,1300" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
