<text x="405" y="2187" font-size="19.00" fill="#6b7280" text-anchor="start" font-weight="400">条件判断</text>
<path d="M625,2180 L673,2180" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<text x="685" y="2187" font-size="19.00" fill="#6b7280" text-anchor="start" font-weight="400">恢复 / 继续</text>
