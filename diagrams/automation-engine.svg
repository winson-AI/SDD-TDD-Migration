<text x="800.0" y="416.5" font-size="26.00" fill="#111827" text-anchor="middle" font-weight="650">adapter 校验与隔离</text>
<text x="800.0" y="450.5" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">验证字段与引用 hash → 设备互斥锁 → 本次独立目录</text>
<text x="800.0" y="479.5" font-size="22.00" fill="#4b5563" text-anchor="middle" font-weight="400">注册 Verify wrapper；加载技能 / 自定义工具</text>
<path d="M800,500 L800,555" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
